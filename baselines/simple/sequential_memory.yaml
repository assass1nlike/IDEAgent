data:
  input_jsonl: data/bkgd_papers.jsonl
  output_dir: results/sequential-memory-baseline-0-11

sequential_memory:
  # Independent-seed matched to Yield/QD max_budget=10: one complete idea per call.
  n_ideas: 10
  init_topic_idx: 0
  end_topic_idx: 3
  resume: true
  min_idea_chars: 300
  signature_char_cap: 256
  # max_background_tokens: null

client:
  request_timeout: 3600

generator:
  # Exactly the same ideator model, reasoning effort, and per-candidate output cap as QD.
  model_id: gpt-5.6-sol
  api_key_env: OPENAI_KEY1
  enable_thinking: true
  thinking_effort: low
  max_new_tokens: 8192

steno:
  # Exactly the same compact semantic signature extractor as QD. Its output is memory,
  # never a score, gate, critique, rejection, repair, or refinement instruction.
  model_id: gemini-2.5-flash
  api_key_env: GEMINI_API_KEY1
  temperature: 1.0
  top_p: 0.95
  enable_thinking: false
  max_new_tokens: 1024
