data:
  input_jsonl: data/bkgd_papers.jsonl
  output_dir: results_organized/generations/nova-closed-book-baseline

nova:
  # 3 rounds x 10 ideas/round = 30 total generations, matching IDEAgent's candidate
  # budget cap B(1+K_aux) = 30 for a fair comparison.
  rounds: 3
  ideas_per_round: 10
  seed_directions: true
  seeds_per_round: 3
  final_k: 10
  init_topic_idx: 0
  end_topic_idx: null
  resume: true
  min_idea_chars: 300
  signature_char_cap: 256
  # max_background_tokens: null

client:
  request_timeout: 3600

generator:
  model_id: gpt-5.6-sol
  api_key_env: OPENAI_KEY2
  enable_thinking: true
  thinking_effort: low
  max_new_tokens: 8192

steno:
  model_id: gemini-2.5-flash
  api_key_env: GEMINI_API_KEY2
  temperature: 1.0
  top_p: 0.95
  enable_thinking: false
  max_new_tokens: 1024

judge:
  model_id: gemini-3.1-pro-preview
  api_key_env: GEMINI_API_KEY2
  enable_thinking: true
  thinking_effort: high
  max_new_tokens: 8192
